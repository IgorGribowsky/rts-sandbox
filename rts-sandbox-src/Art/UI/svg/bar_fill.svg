<svg xmlns="http://www.w3.org/2000/svg" width="48" height="32" viewBox="0 0 48 32">
  <!-- Fill and back of a bar over a unit: white, tinted in the prefab.
       A light band on top and a darker bottom give it volume. 9-sliced,
       border 10 px. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#f2f2f2"/>
      <stop offset="0.42" stop-color="#d8d8d8"/>
      <stop offset="1" stop-color="#a6a6a6"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="48" height="32" rx="9" ry="9" fill="url(#body)"/>
</svg>
