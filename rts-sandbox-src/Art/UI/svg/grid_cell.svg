<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- One cell of the build grid, lying on the ground (M-010). White, the
       material gives it colour. A soft rounded rim and a faint fill: cells
       side by side read as a tidy grid, not as a solid sheet. -->
  <defs>
    <radialGradient id="fill" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.34"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="11" ry="11" fill="url(#fill)"/>
  <rect x="5" y="5" width="54" height="54" rx="10" ry="10" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-opacity="0.95" filter="url(#soft)"/>
</svg>
