<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- One cell of the build grid, lying on the ground (M-010). White, the
       material gives it colour. 0.3.1 style (T-065.6): a thin square edge
       with heavier corner brackets and a faint fill, like the minimap frame;
       cells side by side read as a tidy tactical grid. -->
  <rect x="5" y="5" width="54" height="54" rx="3" ry="3" fill="#ffffff" fill-opacity="0.16"/>
  <rect x="5" y="5" width="54" height="54" rx="3" ry="3" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.75"/>
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="square">
    <path d="M6 18 V6 H18"/>
    <path d="M46 6 H58 V18"/>
    <path d="M58 46 V58 H46"/>
    <path d="M18 58 H6 V46"/>
  </g>
</svg>
