<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Shaft of a skill-shot arrow (M-020). Tiles along its length: side rims,
       a fill brighter at the sides, and a chevron pointing forward (up). -->
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.34"/>
    </linearGradient>
  </defs>
  <rect x="4" y="0" width="120" height="128" fill="url(#fill)"/>
  <rect x="0" y="0" width="5" height="128" fill="#0a0d16" fill-opacity="0.5"/>
  <rect x="123" y="0" width="5" height="128" fill="#0a0d16" fill-opacity="0.5"/>
  <rect x="4" y="0" width="5" height="128" fill="#fff"/>
  <rect x="119" y="0" width="5" height="128" fill="#fff"/>
  <polyline points="30,86 64,52 98,86" fill="none" stroke="#fff" stroke-width="9" stroke-opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>
</svg>