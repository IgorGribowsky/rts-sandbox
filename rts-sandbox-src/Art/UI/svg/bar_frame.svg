<svg xmlns="http://www.w3.org/2000/svg" width="48" height="32" viewBox="0 0 48 32">
  <!-- Rim of a bar over a unit, 0.3.1 style (T-065.5): a flat dark plate
       with a thin light line on top, like the HUD panels. White parts take
       the rim colour of the prefab, the black outline stays black.
       9-sliced, border 12 px. -->
  <rect x="1" y="1" width="46" height="30" rx="6" ry="6" fill="#05070c"/>
  <rect x="3" y="3" width="42" height="26" rx="4" ry="4" fill="#2c2c2c"/>
  <rect x="5" y="3" width="38" height="2.5" rx="1.2" fill="#ffffff"/>
</svg>
