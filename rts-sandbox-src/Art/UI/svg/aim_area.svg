<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Area of a skill under the cursor (M-020): a fill growing towards the
       edge, a bright rim, a dashed inner ring and a mark in the middle. -->
  <defs>
    <radialGradient id="fill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.98" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="254" fill="url(#fill)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#0a0d16" stroke-width="13" stroke-opacity="0.55"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#fff" stroke-width="7"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#fff" stroke-width="4" stroke-opacity="0.5" stroke-dasharray="18 14"/>
  <circle cx="256" cy="256" r="18" fill="none" stroke="#fff" stroke-width="5" stroke-opacity="0.8"/>
</svg>